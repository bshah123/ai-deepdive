<text x="134" y="382" class="sk-hand" font-size="18" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="134" dy="0">One hello.py, three programs that can run it. Each differs in some</tspan><tspan x="134" dy="19.8">way from the Language Reference, so "Python does X" can mean "CPython does X".</tspan></text>
