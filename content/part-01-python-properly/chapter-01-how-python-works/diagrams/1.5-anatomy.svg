<text x="38" y="473" class="sk-hand" font-size="17" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="38" dy="0">Offsets jump by more than 2: CACHE slots are hidden. 6 to 10: 1 slot. 12 to 22: 4 slots. 26 to 34: 3 slots.</tspan><tspan x="38" dy="18.700000000000003">10 instructions + 8 cache slots = 18 slots x 2 bytes = 36 bytes of code.</tspan><tspan x="38" dy="18.700000000000003">LOAD_GLOBAL: low bit of arg means "also push NULL", so arg 1 reads co_names[0].</tspan></text>
