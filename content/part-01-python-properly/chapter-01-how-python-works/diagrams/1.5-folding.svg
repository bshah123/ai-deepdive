<text x="42" y="471" class="sk-hand" font-size="17" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="42" dy="0">n * 60 is evaluated left to right, so (n * 60) is not a constant and nothing after it can be folded.</tspan><tspan x="42" dy="18.700000000000003">Both lists above compile to CONTAINS_OP on a constant: no list or set is built per call.</tspan></text>
