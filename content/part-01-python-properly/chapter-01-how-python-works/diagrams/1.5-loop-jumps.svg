<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" role="img" aria-label="Control flow of the function total with a for loop. Setup runs once; FOR_ITER at offset 10 either runs the body or jumps to offset 28; JUMP_BACKWARD returns to offset 10." class="sketch"><title>Control flow of the function total with a for loop. Setup runs once; FOR_ITER at offset 10 either runs the body or jumps to offset 28; JUMP_BACKWARD returns to offset 10.</title>
<text x="440" y="34" class="sk-hand" font-size="24" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="440" dy="0">A for loop is a jump back to FOR_ITER</tspan></text>
<text x="40" y="96" class="sk-hand" font-size="19" text-anchor="start" style="fill:var(--sk-muted)" font-weight="700"><tspan x="40" dy="0">source</tspan></text>
<text x="40" y="130" class="sk-mono" font-size="16" text-anchor="start" style="fill:var(--sk-blue)" font-weight="700"><tspan x="40" dy="0">s = 0</tspan></text>
<text x="40" y="164" class="sk-mono" font-size="16" text-anchor="start" style="fill:var(--sk-amber)" font-weight="700"><tspan x="40" dy="0">for x in xs:</tspan></text>
<text x="40" y="198" class="sk-mono" font-size="16" text-anchor="start" style="fill:var(--sk-green)" font-weight="700"><tspan x="40" dy="0">    s += x</tspan></text>
<text x="40" y="232" class="sk-mono" font-size="16" text-anchor="start" style="fill:var(--sk-rose)" font-weight="700"><tspan x="40" dy="0">return s</tspan></text>
<text x="40" y="300" class="sk-hand" font-size="17" text-anchor="start" style="fill:var(--sk-muted)"><tspan x="40" dy="0">FOR_ITER 7 (to 28):</tspan><tspan x="40" dy="18.700000000000003">the argument counts</tspan><tspan x="40" dy="18.700000000000003">2-byte slots, from after</tspan><tspan x="40" dy="18.700000000000003">the hidden cache slot:</tspan><tspan x="40" dy="18.700000000000003">14 + 7 x 2 = 28</tspan><tspan x="40" dy="18.700000000000003"></tspan><tspan x="40" dy="18.700000000000003">JUMP_BACKWARD 9 (to 10):</tspan><tspan x="40" dy="18.700000000000003">28 - 9 x 2 = 10</tspan></text>
