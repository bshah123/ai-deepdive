<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-label="Tier 1 specialized bytecode always runs. When it is hot enough and the interpreter was built with the experimental JIT option, it is translated to micro-ops (tier 2), optimized, then turned into machine code (JIT) or run by a tier 2 interpreter used for debugging." class="sketch"><title>Tier 1 specialized bytecode always runs. When it is hot enough and the interpreter was built with the experimental JIT option, it is translated to micro-ops (tier 2), optimized, then turned into machine code (JIT) or run by a tier 2 interpreter used for debugging.</title>
