<text x="720" y="326" class="sk-mono" font-size="15" text-anchor="start" style="fill:var(--sk-green)"><tspan x="720" dy="0">→ 900 products</tspan></text>
<text x="440" y="380" class="sk-hand" font-size="20" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="440" dy="0">double the digits, quadruple the work. CPython switches to Karatsuba only when both numbers</tspan></text>
<text x="440" y="402" class="sk-hand" font-size="20" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="440" dy="0">have more than 70 digits (about 2100 bits, 633 decimal digits).</tspan></text>
