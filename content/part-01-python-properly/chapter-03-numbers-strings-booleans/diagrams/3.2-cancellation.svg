<text x="110" y="216" class="sk-mono" font-size="20" text-anchor="start" style="fill:var(--sk-rose)"><tspan x="110" dy="0">naive difference   1.862645e-08</tspan></text>
<text x="560" y="216" class="sk-hand" font-size="19" text-anchor="start" style="fill:var(--sk-rose)"><tspan x="560" dy="0">error 17.8%</tspan></text>
