<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="Catastrophic cancellation in sqrt(x+1) - sqrt(x) at x = 1e15" class="sketch"><title>Catastrophic cancellation in sqrt(x+1) - sqrt(x) at x = 1e15</title>
<text x="440" y="34" class="sk-hand" font-size="26" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="440" dy="0">Subtracting two nearly equal numbers</tspan></text>
<text x="110" y="84" class="sk-mono" font-size="22" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="110" dy="0">sqrt(1e15 + 1)  =  31622776.60168381</tspan></text>
<text x="110" y="118" class="sk-mono" font-size="22" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="110" dy="0">sqrt(1e15)      =  31622776.60168379</tspan></text>
<text x="110" y="150" class="sk-hand" font-size="17" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="110" dy="0">each root is off by up to half an ulp = 1.86e-9</tspan></text>
