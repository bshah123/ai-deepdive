<text x="560" y="254" class="sk-hand" font-size="19" text-anchor="start" style="fill:var(--sk-green)"><tspan x="560" dy="0">1 / (sqrt(x+1) + sqrt(x))</tspan></text>
<text x="110" y="300" class="sk-hand" font-size="18" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="110" dy="0">rewritten form: relative error 3.8e-18, about one bit</tspan></text>
