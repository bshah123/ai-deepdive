<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="A frame object outlives its call" class="sketch"><title>A frame object outlives its call</title>
<text x="440" y="38" class="sk-hand" font-size="26" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="440" dy="0">A frame object outlives its call</tspan></text>
<path d="M61.3 90.5 C121.7 91.8, 181.6 91.0, 359.4 88.4 M60.3 89.4 C129.8 86.9, 198.9 87.8, 360.4 90.9 M359.8 88.1 C359.4 151.2, 358.0 210.9, 361.1 282.4 M360.7 90.4 C361.0 156.0, 361.6 223.5, 359.3 281.2 M359.3 279.8 C289.5 276.6, 220.6 277.8, 59.0 281.7 M360.7 279.8 C286.5 279.3, 213.9 278.3, 60.0 280.4 M58.4 279.8 C62.1 218.0, 62.6 161.6, 58.4 91.1 M60.5 279.7 C60.7 225.4, 58.6 168.1, 59.1 90.7" style="stroke:var(--sk-muted);fill:none;stroke-dasharray:6 8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="210" y="150" class="sk-hand" font-size="19" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="210" dy="0">make_frame() has returned,</tspan><tspan x="210" dy="20.900000000000002">so its locals should be gone</tspan></text>
<text x="210" y="220" class="sk-hand" font-size="19" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="210" dy="0">the call is off the stack</tspan></text>
