<path d="M460.7 90.3 C532.9 89.6, 607.4 89.2, 820.1 89.8 M459.8 90.3 C574.3 87.2, 688.5 87.7, 820.1 90.0 M822.4 89.3 C820.3 165.6, 822.2 239.2, 818.2 278.2 M819.7 88.9 C820.1 132.6, 818.5 175.6, 818.9 280.5 M819.5 279.2 C713.1 279.0, 605.3 278.4, 458.6 280.2 M819.3 279.4 C696.0 280.0, 571.2 279.8, 459.8 280.5 M459.8 278.5 C456.1 230.3, 457.8 182.5, 461.2 90.1 M459.2 279.7 C458.1 214.2, 458.5 147.7, 458.9 90.6" style="stroke:var(--sk-blue);fill:none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="640" y="125" class="sk-hand" font-size="19" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="640" dy="0">frame object (still referenced)</tspan></text>
<text x="640" y="165" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="640" dy="0">f_code.co_name = make_frame</tspan></text>
<text x="640" y="200" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="640" dy="0">f_locals["secret"] = 42</tspan></text>
<text x="640" y="235" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="640" dy="0">f_back = &lt;module&gt;</tspan></text>
<text x="440" y="310" class="sk-hand" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="440" dy="0">frame = make_frame() keeps the frame object, so its locals and f_back stay reachable.</tspan></text>
</svg>
