<text x="440" y="300" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="440" dy="0">typedef struct { PyObject_HEAD; PyObject *ob_ref; } PyCellObject;</tspan></text>
<text x="440" y="340" class="sk-hand" font-size="19" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="440" dy="0">A cell is a one-slot box: ob_ref holds the value.</tspan></text>
