<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-label="A closure keeps a cell, not the frame: the frame of make_counter() is freed on return, but the cell and the closure keep the variable alive. cell_contents is 2 after two calls." class="sketch"><title>A closure keeps a cell, not the frame: the frame of make_counter() is freed on return, but the cell and the closure keep the variable alive. cell_contents is 2 after two calls.</title>
