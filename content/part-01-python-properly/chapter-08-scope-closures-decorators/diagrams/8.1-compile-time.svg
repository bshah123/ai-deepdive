<text x="660" y="254" class="sk-hand" font-size="18" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="660" dy="0">g is bound in f, so the</tspan></text>
<text x="660" y="278" class="sk-hand" font-size="18" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="660" dy="0">local slot is used: still empty</tspan></text>
