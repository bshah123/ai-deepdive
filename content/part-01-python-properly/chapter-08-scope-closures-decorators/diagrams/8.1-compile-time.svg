<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="Left: a read-only g resolves to the global g and prints 1. Right: an assignment to g in the same body makes g local, so reading it first raises UnboundLocalError." class="sketch"><title>Left: a read-only g resolves to the global g and prints 1. Right: an assignment to g in the same body makes g local, so reading it first raises UnboundLocalError.</title>
<text x="440" y="34" class="sk-hand" font-size="25" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="440" dy="0">One assignment changes where a name is looked up</tspan></text>
<text x="220" y="76" class="sk-hand" font-size="22" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="220" dy="0">only read in f()</tspan></text>
<path d="M28.6 90.5 C106.2 90.4, 184.2 92.3, 411.2 90.4 M30.2 89.9 C158.2 91.3, 286.1 90.9, 409.8 90.2 M412.2 91.8 C408.1 113.2, 409.9 136.1, 408.9 194.1 M410.9 90.0 C410.4 125.8, 411.7 159.2, 409.3 192.8 M410.6 194.5 C285.2 195.8, 161.4 194.9, 30.9 192.8 M410.7 194.2 C318.2 193.2, 226.3 194.4, 29.6 194.7 M31.0 195.7 C31.6 165.1, 28.4 134.0, 28.3 88.4 M30.0 193.5 C28.1 154.7, 29.2 115.1, 31.1 89.1" style="stroke:var(--sk-muted);fill:none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="116" class="sk-mono" font-size="16" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="44" dy="0">g = 1          # module</tspan></text>
<text x="44" y="142" class="sk-mono" font-size="16" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="44" dy="0">def f():</tspan></text>
<text x="44" y="168" class="sk-mono" font-size="16" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="44" dy="0">    print(g)</tspan></text>
<text x="220" y="228" class="sk-hand" font-size="18" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="220" dy="0">g is not bound in f,</tspan></text>
<text x="220" y="252" class="sk-hand" font-size="18" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="220" dy="0">so the search reaches global</tspan></text>
