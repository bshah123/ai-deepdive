<text x="204" y="253" class="sk-hand" font-size="19" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="204" dy="0">no order can satisfy both rules,</tspan><tspan x="204" dy="20.900000000000002">so CPython raises TypeError</tspan></text>
