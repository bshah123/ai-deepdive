<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-label="Inconsistent bases: X(A, B) asks for A before B, but B subclasses A so its MRO needs B before A" class="sketch"><title>Inconsistent bases: X(A, B) asks for A before B, but B subclasses A so its MRO needs B before A</title>
<text x="440" y="34" class="sk-hand" font-size="26" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="440" dy="0">Why class X(A, B) is rejected</tspan></text>
<path d="M49.1 92.1 L360.8 90.6 L362.1 192.0 L52.1 189.1" style="stroke:none;fill:var(--sk-blue-soft)" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M49.9 90.9 C112.2 89.3, 177.2 86.9, 361.2 89.8 M50.7 90.0 C132.8 93.1, 213.4 93.7, 360.6 89.9 M359.5 88.3 C359.4 124.4, 359.6 156.7, 362.3 189.7 M359.8 90.7 C360.1 114.0, 360.2 138.6, 359.6 189.6 M360.1 189.5 C283.9 190.3, 204.1 189.8, 48.7 190.7 M360.8 189.8 C255.5 189.9, 152.6 189.9, 50.4 189.9 M50.1 192.1 C51.0 161.9, 48.6 129.4, 50.0 88.8 M50.2 189.0 C49.3 159.6, 49.6 131.7, 50.4 90.9" style="stroke:var(--sk-ink);fill:none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="205" y="122" class="sk-hand" font-size="19" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="205" dy="0">Rule 1: keep the bases order</tspan></text>
<text x="205" y="160" class="sk-mono" font-size="18" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="205" dy="0">X lists A before B</tspan></text>
<path d="M519.6 89.0 L829.6 90.4 L830.0 192.3 L520.8 188.6" style="stroke:none;fill:var(--sk-amber-soft)" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
