<text x="675" y="122" class="sk-hand" font-size="19" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="675" dy="0">Rule 2: keep each base MRO</tspan></text>
<text x="675" y="160" class="sk-mono" font-size="18" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="675" dy="0">B(A) has B before A</tspan></text>
