<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img" aria-label="Attribute lookup precedence: a data descriptor beats the instance dict, a non-data descriptor or plain class value loses to it." class="sketch"><title>Attribute lookup precedence: a data descriptor beats the instance dict, a non-data descriptor or plain class value loses to it.</title>
