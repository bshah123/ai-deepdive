<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-label="Which source answers obj.x for four kinds of name, with and without the name in the instance dict. Winners: descriptor, instance dict, class attribute or __getattr__." class="sketch"><title>Which source answers obj.x for four kinds of name, with and without the name in the instance dict. Winners: descriptor, instance dict, class attribute or __getattr__.</title>
<text x="440" y="40" class="sk-hand" font-size="24" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="440" dy="0">Who answers obj.x?</tspan></text>
