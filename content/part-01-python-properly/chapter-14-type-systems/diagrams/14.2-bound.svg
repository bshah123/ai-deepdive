<text x="650" y="102" class="sk-hand" font-size="22" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="650" dy="0">T bound to Orderable</tspan></text>
<text x="650" y="144" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="650" dy="0">O = TypeVar("O", bound=Orderable)</tspan></text>
<text x="650" y="172" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="650" dy="0">mypy accepts x &gt; y for O</tspan></text>
<text x="650" y="230" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="650" dy="0">larger(Plain(), Plain())</tspan></text>
<text x="650" y="256" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="650" dy="0">mypy: cannot be "Plain"</tspan></text>
<text x="440" y="330" class="sk-hand" font-size="20" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="440" dy="0">The bound is a promise the checker can use.</tspan></text>
</svg>
