<text x="440" y="186" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-rose)"><tspan x="440" dy="0">grad_a += grad_b = 24</tspan></text>
<text x="440" y="210" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-rose)"><tspan x="440" dy="0">grad_y += grad_b = 24</tspan></text>
