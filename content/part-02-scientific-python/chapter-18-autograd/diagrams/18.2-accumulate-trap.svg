<text x="655" y="140" class="sk-mono" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="655" dy="0">a.grad = 4 + 1 + 3 x 2 = 11</tspan></text>
<text x="655" y="172" class="sk-mono" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="655" dy="0">c.grad = 1 + 1 = 2</tspan></text>
