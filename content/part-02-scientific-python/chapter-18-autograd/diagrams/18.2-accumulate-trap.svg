<text x="225" y="140" class="sk-mono" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="225" dy="0">a.grad = 0 + 1 + 3 = 4</tspan></text>
<text x="225" y="172" class="sk-mono" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="225" dy="0">c.grad = 1</tspan></text>
<text x="225" y="212" class="sk-mono" font-size="17" text-anchor="middle" style="fill:var(--sk-green)"><tspan x="225" dy="0">correct: dy/da = 4</tspan></text>
