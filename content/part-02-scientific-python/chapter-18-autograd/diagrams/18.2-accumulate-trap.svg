<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="Two backward passes on the same graph: the second pass adds to gradients left from the first" class="sketch"><title>Two backward passes on the same graph: the second pass adds to gradients left from the first</title>
