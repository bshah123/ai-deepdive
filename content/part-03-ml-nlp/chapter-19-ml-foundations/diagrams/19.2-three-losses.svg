<text x="442" y="158" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="442" dy="0">model outputs</tspan></text>
<text x="442" y="182" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="442" dy="0">p = sigmoid(z), in (0, 1)</tspan></text>
<text x="442" y="220" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="442" dy="0">target</tspan></text>
<text x="442" y="244" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="442" dy="0">y in {0, 1}</tspan></text>
<text x="442" y="280" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="442" dy="0">loss</tspan></text>
<text x="442" y="304" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="442" dy="0">BCE = -[y ln p</tspan><tspan x="442" dy="17.6">+ (1-y) ln(1-p)]</tspan></text>
