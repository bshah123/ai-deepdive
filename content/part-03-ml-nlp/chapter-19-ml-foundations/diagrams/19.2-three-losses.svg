<text x="158" y="158" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="158" dy="0">model outputs</tspan></text>
<text x="158" y="182" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="158" dy="0">a number yhat</tspan></text>
<text x="158" y="220" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="158" dy="0">target</tspan></text>
<text x="158" y="244" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="158" dy="0">a real number y</tspan></text>
<text x="158" y="280" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="158" dy="0">loss</tspan></text>
<text x="158" y="304" class="sk-mono" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="158" dy="0">MSE = mean (y - yhat)^2</tspan></text>
