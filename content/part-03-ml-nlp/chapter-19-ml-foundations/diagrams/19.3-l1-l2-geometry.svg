<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-label="Ridge constraint is a circle and lasso constraint is a diamond; the lasso solution lands on an axis at a corner. Illustrative geometry." class="sketch"><title>Ridge constraint is a circle and lasso constraint is a diamond; the lasso solution lands on an axis at a corner. Illustrative geometry.</title>
