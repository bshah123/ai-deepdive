<text x="200" y="294" class="sk-mono" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="200" dy="0">ridge (L2): w1^2 + w2^2 &lt;= t</tspan></text>
<text x="620" y="294" class="sk-mono" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="620" dy="0">lasso (L1): |w1| + |w2| &lt;= t</tspan></text>
<text x="200" y="322" class="sk-hand" font-size="19" text-anchor="middle" style="fill:var(--sk-blue)"><tspan x="200" dy="0">contact: both coefficients nonzero</tspan></text>
<text x="620" y="322" class="sk-hand" font-size="19" text-anchor="middle" style="fill:var(--sk-amber)"><tspan x="620" dy="0">contact: w2 = 0 (a corner on an axis)</tspan></text>
<text x="440" y="352" class="sk-hand" font-size="15" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="440" dy="0">black dot: OLS solution; green dot: first contact; dashed rings: loss contours (circular, as for an orthonormal design)</tspan></text>
</svg>
