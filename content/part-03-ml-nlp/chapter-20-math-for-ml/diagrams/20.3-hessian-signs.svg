<text x="745" y="172" class="sk-mono" font-size="19" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="745" dy="0">H = [ -2  0 ]</tspan><tspan x="745" dy="20.900000000000002">    [ 0  -2 ]</tspan></text>
<text x="745" y="240" class="sk-mono" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="745" dy="0">eigenvalues: -2, -2</tspan></text>
<text x="745" y="285" class="sk-hand" font-size="22" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="745" dy="0">dome: local maximum</tspan></text>
<text x="440" y="348" class="sk-hand" font-size="18" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="440" dy="0">All three Hessians are diagonal, so their eigenvalues are the diagonal entries.</tspan></text>
</svg>
