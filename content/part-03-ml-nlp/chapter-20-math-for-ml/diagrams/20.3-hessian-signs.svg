<text x="165" y="172" class="sk-mono" font-size="19" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="165" dy="0">H = [ 2  0 ]</tspan><tspan x="165" dy="20.900000000000002">    [ 0  2 ]</tspan></text>
