<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-label="Four update rules side by side: what each keeps between steps and the update it applies" class="sketch"><title>Four update rules side by side: what each keeps between steps and the update it applies</title>
<text x="440" y="34" class="sk-hand" font-size="26" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="440" dy="0">Same gradient g, four memories</tspan></text>
<path d="M26.1 67.0 L220.8 67.2 L221.2 114.1 L24.7 111.7" style="stroke:none;fill:var(--sk-muted)" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M25.3 67.3 C65.3 66.4, 105.1 67.7, 220.8 66.4 M23.0 65.9 C74.2 68.2, 125.5 69.6, 220.8 65.6 M220.7 66.5 C220.9 84.1, 222.0 101.1, 221.8 113.8 M219.3 66.9 C220.2 80.8, 220.7 92.8, 221.0 112.1 M219.9 111.5 C156.9 111.4, 90.0 113.8, 22.1 112.2 M219.8 112.0 C142.4 113.7, 66.5 113.3, 24.9 111.9 M21.6 112.8 C24.5 95.3, 24.7 74.3, 23.2 63.6 M23.9 111.1 C23.8 99.5, 22.8 87.0, 24.0 65.8" style="stroke:var(--sk-muted);fill:none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="122" y="97" class="sk-hand" font-size="24" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="122" dy="0">SGD</tspan></text>
<text x="122" y="150" class="sk-hand" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="122" dy="0">keeps: nothing</tspan></text>
<text x="122" y="196" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="122" dy="0">w -= lr * g</tspan></text>
<path d="M233.8 63.9 L431.7 66.9 L431.1 109.6 L235.4 111.1" style="stroke:none;fill:var(--sk-amber-soft)" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M236.0 66.1 C279.3 62.0, 318.8 64.7, 434.2 64.4 M235.4 65.0 C292.1 64.0, 347.1 64.6, 430.9 65.3 M432.2 66.8 C432.2 83.9, 434.1 103.1, 433.1 110.3 M432.9 67.1 C432.2 81.8, 431.5 100.3, 432.3 111.3 M430.8 113.6 C364.6 113.5, 296.2 115.3, 233.9 114.2 M431.9 113.1 C360.2 110.3, 287.7 112.0, 236.8 113.1 M235.1 110.0 C235.8 101.0, 233.9 87.3, 238.4 64.6 M235.0 111.1 C236.3 101.6, 236.0 90.4, 235.3 65.8" style="stroke:var(--sk-amber);fill:none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="334" y="97" class="sk-hand" font-size="24" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="334" dy="0">Momentum</tspan></text>
<text x="334" y="150" class="sk-hand" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="334" dy="0">keeps: v (velocity)</tspan></text>
<text x="334" y="196" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="334" dy="0">v = mu*v + g</tspan></text>
<text x="334" y="230" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="334" dy="0">w -= lr * v</tspan></text>
<path d="M446.3 65.6 L642.6 66.7 L645.8 109.9 L446.1 110.6" style="stroke:none;fill:var(--sk-green-soft)" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M446.6 64.9 C488.5 63.3, 527.8 67.2, 642.9 67.3 M447.8 66.5 C507.6 65.3, 566.4 65.3, 643.4 65.0 M643.6 67.1 C643.5 74.6, 646.2 86.8, 644.4 111.7 M644.0 65.0 C645.2 75.9, 643.4 87.1, 643.6 112.9 M641.7 111.0 C572.4 110.8, 502.5 112.0, 445.7 111.3 M644.0 111.7 C575.6 115.0, 508.9 113.9, 448.7 112.0 M448.7 112.1 C447.1 97.6, 448.0 77.1, 448.7 65.5 M448.4 111.1 C448.8 103.7, 449.1 93.9, 449.1 65.8" style="stroke:var(--sk-green);fill:none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="546" y="97" class="sk-hand" font-size="24" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="546" dy="0">RMSprop</tspan></text>
<text x="546" y="150" class="sk-hand" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="546" dy="0">keeps: s (avg of g^2)</tspan></text>
<text x="546" y="196" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="546" dy="0">s = a*s + (1-a)*g^2</tspan></text>
<text x="546" y="230" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="546" dy="0">w -= lr*g/sqrt(s)</tspan></text>
<path d="M658.7 67.3 L858.2 66.5 L855.7 110.2 L661.6 110.0" style="stroke:none;fill:var(--sk-blue-soft)" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M662.0 63.6 C702.5 69.3, 741.5 69.8, 856.3 65.4 M660.2 65.7 C723.1 66.7, 788.1 68.4, 855.9 67.1 M855.1 67.4 C853.4 74.5, 857.0 88.8, 855.7 113.1 M855.2 65.2 C855.8 79.2, 855.2 94.6, 854.9 112.1 M857.3 113.1 C780.1 113.0, 708.7 113.5, 662.3 113.2 M856.0 112.7 C793.4 111.6, 730.1 112.6, 660.7 110.8 M662.2 114.1 C658.4 98.6, 662.0 90.1, 659.0 66.5 M659.5 111.1 C661.3 94.2, 659.8 78.9, 660.4 65.8" style="stroke:var(--sk-blue);fill:none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="758" y="97" class="sk-hand" font-size="24" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="758" dy="0">AdamW</tspan></text>
<text x="758" y="150" class="sk-hand" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="758" dy="0">keeps: m, v, step t</tspan></text>
<text x="758" y="196" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="758" dy="0">w *= 1 - lr*wd</tspan></text>
<text x="758" y="230" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="758" dy="0">m, v = EMAs of g, g^2</tspan></text>
<text x="758" y="264" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="758" dy="0">w -= lr*m^/sqrt(v^)</tspan></text>
<text x="440" y="330" class="sk-hand" font-size="18" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="440" dy="0">m^ and v^ are bias-corrected: divided by (1 - beta1^t) and (1 - beta2^t).</tspan></text>
<text x="440" y="364" class="sk-hand" font-size="18" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="440" dy="0">AdamW shrinks w first, then takes an Adam step; the decay never passes through the gradient.</tspan></text>
</svg>
