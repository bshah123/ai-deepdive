<text x="484" y="126" class="sk-hand" font-size="18" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="484" dy="0">PE(p) sits at angle p x omega (60 deg here).</tspan><tspan x="484" dy="19.8">A shift by k adds k x omega (40 deg here).</tspan><tspan x="484" dy="19.8">So PE(p+k) = Rot(k x omega) PE(p) for every p.</tspan><tspan x="484" dy="19.8">The dot product then depends on k only.</tspan></text>
</g>
