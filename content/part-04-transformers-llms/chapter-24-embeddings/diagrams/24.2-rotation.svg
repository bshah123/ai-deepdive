<text x="358.3288528313429" y="205.10129954336233" class="sk-mono" font-size="18" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="358.3288528313429" dy="0">PE(p+k)</tspan></text>
<text x="220" y="342" class="sk-hand" font-size="17" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="220" dy="0">angle = position x omega</tspan></text>
<g transform="rotate(-1.5 665 185)">
