<text x="230" y="146" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="230" dy="0">ΔW = B · A = 0 (model = pretrained)</tspan></text>
<text x="230" y="180" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="230" dy="0">‖∂L/∂B‖ = 22.40  (non-zero: B moves)</tspan></text>
<text x="230" y="214" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="230" dy="0">‖∂L/∂A‖ = 0.0  (exactly zero: A is frozen)</tspan></text>
