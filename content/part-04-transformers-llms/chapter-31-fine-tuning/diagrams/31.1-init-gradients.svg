<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" role="img" aria-label="At initialisation B is zero: the gradient reaches B but not A; after one step A starts to learn" class="sketch"><title>At initialisation B is zero: the gradient reaches B but not A; after one step A starts to learn</title>
<text x="440" y="34" class="sk-hand" font-size="26" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="440" dy="0">Why B starts at zero</tspan></text>
