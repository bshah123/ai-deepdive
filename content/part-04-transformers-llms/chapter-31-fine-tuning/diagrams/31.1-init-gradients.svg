<text x="650" y="146" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="650" dy="0">ΔW = B · A ≠ 0 (update now active)</tspan></text>
<text x="650" y="180" class="sk-mono" font-size="15" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="650" dy="0">∂L/∂A = s · Bᵀ · ∂L/∂y · xᵀ ≠ 0</tspan></text>
<text x="650" y="214" class="sk-hand" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="650" dy="0">A now gets a gradient and moves</tspan></text>
