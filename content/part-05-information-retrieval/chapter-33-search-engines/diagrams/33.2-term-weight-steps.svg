<text x="440" y="205" class="sk-hand" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="440" dy="0">IDF(cat) = log(1 + (N − n + 0.5)/(n + 0.5)) = log(1 + 2.5/2.5) = 0.693, where N = 4 and n = 2</tspan></text>
<text x="440" y="240" class="sk-hand" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="440" dy="0">dog adds 0.693 (f = 1 gives tf part 1.000), so d1 = 0.953 + 0.693 = 1.646</tspan></text>
<text x="440" y="290" class="sk-hand" font-size="18" text-anchor="middle" style="fill:var(--sk-muted)"><tspan x="440" dy="0">Each query term adds one contribution. The score is their sum.</tspan></text>
