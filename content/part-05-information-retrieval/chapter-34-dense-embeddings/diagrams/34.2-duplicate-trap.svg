<text x="480" y="120" class="sk-hand" font-size="20" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="480" dy="0">Doc 2 has the same text as doc 1,</tspan><tspan x="480" dy="22">so any encoder gives both the same vector.</tspan><tspan x="480" dy="22">Row 1: p(doc 1) = 0.5, so loss = −log 0.5</tspan><tspan x="480" dy="22">Loss = log 2 = 0.693 for any τ</tspan></text>
