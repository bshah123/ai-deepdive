<text x="155" y="148" class="sk-hand" font-size="22" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="155" dy="0">1  local moving</tspan></text>
<text x="155" y="176" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="155" dy="0">move each node to the</tspan></text>
<text x="155" y="200" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="155" dy="0">neighbour community that</tspan></text>
<text x="155" y="224" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="155" dy="0">raises Q</tspan></text>
<path d="M314.4 120.0 L564.2 119.3 L567.1 232.1 L313.6 228.4" style="stroke:none;fill:var(--sk-blue-soft)" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M315.9 118.7 C366.0 118.3, 415.2 120.0, 565.1 118.1 M315.7 121.0 C404.6 123.7, 493.5 123.5, 565.6 120.6 M564.4 121.3 C564.1 161.9, 565.4 200.6, 567.0 230.8 M564.7 119.9 C564.2 158.2, 562.8 198.3, 565.0 231.0 M565.8 228.5 C465.9 231.0, 365.0 232.1, 315.6 229.7 M565.5 229.7 C492.6 231.8, 421.3 230.5, 315.5 229.5 M313.8 230.7 C315.5 193.9, 318.6 160.5, 313.5 120.0 M314.4 230.8 C315.1 206.6, 314.2 183.3, 316.1 120.7" style="stroke:var(--sk-blue);fill:none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="148" class="sk-hand" font-size="22" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="440" dy="0">2  refinement</tspan></text>
<text x="440" y="176" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="440" dy="0">inside each community P,</tspan></text>
<text x="440" y="200" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="440" dy="0">start from singletons; merge</tspan></text>
<text x="440" y="224" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="440" dy="0">only well-connected pieces</tspan></text>
<path d="M599.9 121.7 L848.0 119.1 L850.0 232.4 L602.1 227.8" style="stroke:none;fill:var(--sk-blue-soft)" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
