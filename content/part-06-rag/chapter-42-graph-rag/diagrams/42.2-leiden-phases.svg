<text x="725" y="148" class="sk-hand" font-size="22" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="725" dy="0">3  aggregation</tspan></text>
<text x="725" y="176" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="725" dy="0">each refined piece becomes</tspan></text>
<text x="725" y="200" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="725" dy="0">one node; repeat on the</tspan></text>
<text x="725" y="224" class="sk-hand" font-size="16" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="725" dy="0">smaller graph</tspan></text>
