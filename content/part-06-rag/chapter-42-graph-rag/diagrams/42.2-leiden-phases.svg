<path d="M154.4 232.7 C154.6 237.1, 153.6 238.6, 148.8 243.9 M155.6 234.1 C153.8 236.9, 152.5 238.4, 149.5 244.5" style="stroke:var(--sk-muted);fill:none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="318" class="sk-hand" font-size="18" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="440" dy="0">repeat until no node moves</tspan></text>
<text x="440" y="356" class="sk-hand" font-size="17" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="440" dy="0">Louvain stops at step 1 and aggregates the unrefined partition P instead.</tspan></text>
</svg>
