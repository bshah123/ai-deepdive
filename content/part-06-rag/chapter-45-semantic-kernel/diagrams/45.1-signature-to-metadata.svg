<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-label="A Python signature becomes the function description the model reads" class="sketch"><title>A Python signature becomes the function description the model reads</title>
<text x="440" y="34" class="sk-hand" font-size="26" text-anchor="middle" style="fill:var(--sk-ink)" font-weight="700"><tspan x="440" dy="0">What the kernel reads from your signature</tspan></text>
