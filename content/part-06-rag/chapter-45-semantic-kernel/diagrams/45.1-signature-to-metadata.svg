<text x="36" y="120" class="sk-mono" font-size="15" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="36" dy="0">class MathPlugin:</tspan></text>
<text x="36" y="158" class="sk-mono" font-size="15" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="36" dy="0">    def add(</tspan></text>
<text x="36" y="196" class="sk-mono" font-size="15" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="36" dy="0">        num1: Annotated[float, "first number"],</tspan></text>
<text x="36" y="234" class="sk-mono" font-size="15" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="36" dy="0">        num2: Annotated[float, "second number"]</tspan></text>
<text x="36" y="272" class="sk-mono" font-size="15" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="36" dy="0">    ) -&gt; float</tspan></text>
<text x="540" y="120" class="sk-hand" font-size="17" text-anchor="start" style="fill:var(--sk-muted)"><tspan x="540" dy="0">plugin 'math' is given to add_plugin</tspan></text>
<text x="540" y="158" class="sk-hand" font-size="19" text-anchor="start" style="fill:var(--sk-green)" font-weight="700"><tspan x="540" dy="0">name: math-add</tspan></text>
<text x="540" y="196" class="sk-hand" font-size="18" text-anchor="start" style="fill:var(--sk-blue)"><tspan x="540" dy="0">num1: float, required, "first number"</tspan></text>
<text x="540" y="234" class="sk-hand" font-size="18" text-anchor="start" style="fill:var(--sk-blue)"><tspan x="540" dy="0">num2: float, required, "second number"</tspan></text>
<text x="540" y="272" class="sk-hand" font-size="18" text-anchor="start" style="fill:var(--sk-violet)"><tspan x="540" dy="0">returns: float</tspan></text>
