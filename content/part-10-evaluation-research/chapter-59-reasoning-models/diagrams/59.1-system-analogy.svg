<text x="235" y="150" class="sk-hand" font-size="19" text-anchor="middle" style="fill:var(--sk-ink)"><tspan x="235" dy="0">one forward pass</tspan><tspan x="235" dy="20.900000000000002">fixed compute per token</tspan><tspan x="235" dy="20.900000000000002">answer emitted at once</tspan></text>
