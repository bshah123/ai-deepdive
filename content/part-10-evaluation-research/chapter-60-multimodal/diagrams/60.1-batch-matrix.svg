<text x="654" y="155" class="sk-hand" font-size="17" text-anchor="start" style="fill:var(--sk-ink)"><tspan x="654" dy="0">Blue: N true pairs</tspan><tspan x="654" dy="18.700000000000003">(the diagonal).</tspan><tspan x="654" dy="18.700000000000003"></tspan><tspan x="654" dy="18.700000000000003">Other cells: N² − N</tspan><tspan x="654" dy="18.700000000000003">negatives, taken free</tspan><tspan x="654" dy="18.700000000000003">from the same batch.</tspan><tspan x="654" dy="18.700000000000003"></tspan><tspan x="654" dy="18.700000000000003">Amber: a negative that</tspan><tspan x="654" dy="18.700000000000003">beats the true caption.</tspan></text>
